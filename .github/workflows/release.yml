name: Release Automation

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  RUST_VERSION: stable

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          echo "Generating changelog..."

          # Get the previous tag
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "First release - using all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Comparing $PREVIOUS_TAG..HEAD"
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save to file for multiline output
          echo "$CHANGELOG" > changelog.txt

          echo "Changelog generated"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body_path: changelog.txt
          draft: false
          prerelease: false

  build-rust-core:
    name: Build Rust Core Libraries
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # iOS targets
          - os: macos-latest
            target: aarch64-apple-ios
            platform: ios
            artifact_name: libcyrillic_ime_core_ios.a
          # Android targets
          - os: ubuntu-latest
            target: aarch64-linux-android
            platform: android
            artifact_name: libcyrillic_ime_core_android_arm64.so
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            platform: android
            artifact_name: libcyrillic_ime_core_android_armv7.so

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_core/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-lipo (iOS)
        if: matrix.platform == 'ios'
        run: cargo install cargo-lipo

      - name: Install cargo-ndk (Android)
        if: matrix.platform == 'android'
        run: cargo install cargo-ndk

      - name: Setup Android NDK (Android)
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Build Rust Core (iOS)
        if: matrix.platform == 'ios'
        working-directory: rust_core
        run: |
          cargo lipo --release --targets ${{ matrix.target }}
          cp target/universal/release/libcyrillic_ime_core.a ${{ matrix.artifact_name }}

      - name: Build Rust Core (Android)
        if: matrix.platform == 'android'
        working-directory: rust_core
        run: |
          cargo ndk --target ${{ matrix.target }} --platform 29 -- build --release
          cp target/${{ matrix.target }}/release/libcyrillic_ime_core.so ${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: rust_core/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: application/octet-stream

  build-documentation:
    name: Build Documentation Package
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create documentation archive
        run: |
          zip -r documentation.zip docs/ README.md CLAUDE.md CONTRIBUTING.md

      - name: Upload Documentation Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: documentation.zip
          asset_name: documentation-${{ needs.create-release.outputs.version }}.zip
          asset_content_type: application/zip

  publish-release-notes:
    name: Publish Release Notes
    needs: [create-release, build-rust-core, build-documentation]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate release summary
        run: |
          cat > release_summary.md << 'EOF'
          # Release ${{ needs.create-release.outputs.version }}

          ## 🎉 What's New

          This release includes:

          - ✅ Rust Core libraries for iOS and Android
          - ✅ Complete documentation package
          - ✅ JSON profile schemas

          ## 📦 Assets

          - **iOS Library**: `libcyrillic_ime_core_ios.a`
          - **Android Library (ARM64)**: `libcyrillic_ime_core_android_arm64.so`
          - **Android Library (ARMv7)**: `libcyrillic_ime_core_android_armv7.so`
          - **Documentation**: `documentation-${{ needs.create-release.outputs.version }}.zip`

          ## 🚀 Getting Started

          ### iOS Development
          1. Download `libcyrillic_ime_core_ios.a`
          2. Follow the [iOS デプロイガイド](https://github.com/${{ github.repository }}/blob/main/docs/iOS_デプロイ_初心者向けコマンドライン完全ガイド.md)

          ### Android Development
          1. Download Android libraries
          2. Follow the [Android デプロイガイド](https://github.com/${{ github.repository }}/blob/main/docs/Android_デプロイ_初心者向けコマンドライン完全ガイド.md)

          ## 📚 Documentation

          - [Project README](https://github.com/${{ github.repository }}/blob/main/README.md)
          - [Documentation Index](https://github.com/${{ github.repository }}/blob/main/docs/README.md)
          - [Contributing Guide](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md)

          ## 🐛 Bug Reports

          If you encounter any issues, please [open an issue](https://github.com/${{ github.repository }}/issues).
          EOF

          cat release_summary.md

      - name: Comment on release
        run: |
          echo "Release ${{ needs.create-release.outputs.version }} published successfully!"

name: "CodeQL"

on:
  push:
    branches: [ "develop" ]
    paths:
      - '**/*.py'
  pull_request:
    branches: [ "develop" ]
    paths:
      - '**/*.py'
  schedule:
    - cron: '32 19 * * 4'

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:python"

name: Documentation Lint & Check

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs-lint.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore .github \
            --config .markdownlint.json || true

  markdown-link-check:
    name: Markdown Link Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check links in markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.markdown-link-check.json'
          folder-path: 'docs/'

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cspell
        run: npm install -g cspell

      - name: Run spell check
        run: |
          cspell "**/*.md" \
            --config .cspell.json \
            --no-progress \
            --show-context || true

  doc-structure-check:
    name: Documentation Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required documentation files
        run: |
          echo "Checking required documentation files..."

          required_files=(
            "README.md"
            "CLAUDE.md"
            "docs/README.md"
            "docs/要件定義書.md"
            "docs/アプリ設計書.md"
          )

          missing_files=()

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              missing_files+=("$file")
            else
              echo "✅ Found: $file"
            fi
          done

          if [ ${#missing_files[@]} -gt 0 ]; then
            echo ""
            echo "⚠️ Missing ${#missing_files[@]} required file(s)"
            exit 1
          else
            echo ""
            echo "✅ All required documentation files present"
          fi

      - name: Check documentation index consistency
        run: |
          echo "Checking if all docs are listed in docs/README.md..."

          # Find all markdown files in docs/
          all_docs=$(find docs -name "*.md" -not -name "README.md" | sort)

          echo "Found documentation files:"
          echo "$all_docs"

          echo ""
          echo "Checking if they are referenced in docs/README.md..."

          missing_refs=()

          for doc in $all_docs; do
            doc_name=$(basename "$doc")
            if ! grep -q "$doc_name" docs/README.md; then
              echo "⚠️ Not referenced: $doc_name"
              missing_refs+=("$doc_name")
            else
              echo "✅ Referenced: $doc_name"
            fi
          done

          if [ ${#missing_refs[@]} -gt 0 ]; then
            echo ""
            echo "⚠️ ${#missing_refs[@]} file(s) not referenced in docs/README.md"
            echo "Consider adding them to the index"
          else
            echo ""
            echo "✅ All documentation files are referenced"
          fi

  json-schema-validation:
    name: JSON Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv-cli
        run: npm install -g ajv-cli

      - name: Validate JSON files
        run: |
          echo "Checking JSON files for syntax errors..."

          json_files=$(find profiles -name "*.json")

          for file in $json_files; do
            echo "Validating: $file"
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "❌ Invalid JSON: $file"
              exit 1
            else
              echo "✅ Valid: $file"
            fi
          done

          echo ""
          echo "✅ All JSON files are valid"

name: Pismo
options:
  bundleIdPrefix: com.pismo
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ja
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "Q9DB95D8L9"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"

targets:
  Pismo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CyrillicIME
        name: CyrillicIME
      - path: Shared
        name: Shared
      - path: CyrillicKeyboard/Engine
        name: Engine
    resources:
      - CyrillicIME/Assets.xcassets
    info:
      path: CyrillicIME/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleDisplayName: Pismo
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Pismo
        PRODUCT_BUNDLE_IDENTIFIER: com.pismo.Pismo
        INFOPLIST_FILE: CyrillicIME/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/CyrillicIMECore"
        SWIFT_OBJC_BRIDGING_HEADER: CyrillicIME/CyrillicIME-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lc++ -lresolv"
    dependencies:
      - framework: CyrillicIMECore/libcyrillic_ime_core.a
        embed: false
      - target: PismoKeyboard
    entitlements:
      path: CyrillicIME/Pismo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pismo

  PismoKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CyrillicKeyboard
        name: CyrillicKeyboard
      - path: Shared
        name: Shared
    resources:
      - ../../profiles/profiles.json
      - ../../profiles/japaneseKanaEngine.json
      - path: ../../profiles/schemas
        type: folder
    info:
      path: CyrillicKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Pismo Keyboard
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ja
            RequestsOpenAccess: false
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_NAME: PismoKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: com.pismo.Pismo.PismoKeyboard
        INFOPLIST_FILE: CyrillicKeyboard/Info.plist
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/CyrillicIMECore"
        SWIFT_OBJC_BRIDGING_HEADER: CyrillicKeyboard/CyrillicKeyboard-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lc++ -lresolv"
    dependencies:
      - framework: CyrillicIMECore/libcyrillic_ime_core.a
        embed: false
    entitlements:
      path: CyrillicKeyboard/PismoKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pismo

  PismoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CyrillicIMETests
    dependencies:
      - target: Pismo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pismo.PismoTests
        INFOPLIST_FILE: CyrillicIMETests/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/CyrillicIMECore"

schemes:
  Pismo:
    build:
      targets:
        Pismo: all
        PismoKeyboard: all
        PismoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PismoTests
    archive:
      config: Release
